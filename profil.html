<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Profil utilisateur</title>
    <meta name="description" content="Profil de l'utilisateur de la messagerie">
    <link rel="stylesheet" href="style_page_central.css">

  </head>
  <body>
    <h1>Profil utilisateur</h1>
    <div class="messagerie">

      <!--menu de navigation-->
      <aside class="colonne-gauche">
        <div class="section">
          <h2>Menu</h2>
          <ul class="liste-contacts">
            <li>
              <a class="bouton-lien" href="projet_fil_rouge.html">
                Messagerie</a>
              </li>

            <li><a class="bouton-lien actif"
      href="profil.html">
      Mon profil</a>
    </li>
         <li>
    <a class="bouton-lien" href="#" id="deconnexion">
        Déconnexion
    </a>
</li>

          </ul>
        </div>
      </aside>
      <!--information du profil-->
      <section class="section">
        
        <h2>Compte</h2>
        <form id="formulaire-profil">
          <div class="champ-profil">
            <label for="nom">Nom d'utilisateur:</label>
            <input type="text" id="nom"required>
          </div>
          <div class="champ-profil">
            <label for="courriel">Adresse courriel:</label>
            <input type="email" id="courriel" disabled>
          </div>
          <div class="champ-profil">
            <label for="naissance">Date de naissance:</label>
            <input type="date" id="naissance">
          </div>
          <button type="submit">Enregister les modifications</button>
        </form>
        <p id="message-profil"></p>
       
      </section>
    </div>
    <script type="module" src="profil.js"></script>
  </body>

</html>
