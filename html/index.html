<!doctype html>
 <html lang="fr">

<head>
   <meta charset="utf-8">

   <title> connnection </title>

   <meta name="description" content="page de connexion a la messagerie">
   
   <link rel="stylesheet" href="style.css">
</head>

<body>
   <h1> Red ligne messagerie </h1>
  <form id="formulaire-connexion">

      <label for="courriel">Adresse courriel :</label>
        <input type="email" id="courriel" required>
        <br><br>
 
      <label for="nom">Name:</label>
      <input type="text" id="nom" name="nom" required>
   <br><br>

  <label for="pwd">Mot de passe</label>
  <input type="password" id="pwd" name="pwd" required>

      <br><br>
            <label for="nom">Date de naissance:</label>
            <input type="date" id="naissance" name="naissance" required>
      <br><br>

      <button type="submit">Créer un compte</button>
      
       <button type="button" id="bouton-connexion">
        Se connecter
    </button>

  </form>

  <script type="module" src="connexion.js"></script>
  
</body>
 </html>
