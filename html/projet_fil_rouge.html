<!doctype html>
  <html>
    
    <head>
      <link rel="stylesheet" href="style_page_central.css">
     <meta charset="utf-8">
     <title> Red ligne message </title>
   
     <meta name="description"
      content="blabla">
    </head>
  

  
    <body>
      <h1>Message</h1>
      <p id="bienvenue"></p>
      <button id="bouton-deconnexion">
       Se déconnecter
      </button>

       <div class="messagerie">
        <aside class="colonne-gauche">
    <section>  
      
      <div class="section">
        <h3>
          liste des contacts
        </h3>
        <details open>
          <summary>
            mes contacts
          </summary>

          <!-- Ajouter un contact par son nom -->
          <form id="form-ajout-contact" class="ajout-contact">
            <input id="champ-ajout-contact" type="text" placeholder="Nom à ajouter" autocomplete="off">
            <button type="submit">Ajouter</button>
          </form>
          <p id="message-contact"></p>

          <ul class="liste-contacts" id="liste-mes-contacts">
             <li>Chargement...</li>
          </ul>
        </details>

        <details>
          <summary>
            tous les utilisateurs
          </summary>
          <ul class="liste-contacts" id="liste-contacts">
             <li>chargement des utilisateur...</li>
          </ul>
        </details>


        </div>
    </section>

    <section>
      <div class="section">
      <h2>
        liste des salons
      </h2>

      <!-- Créer un salon public -->
      <form id="form-salon" class="ajout-contact">
        <input id="champ-salon" type="text" placeholder="Nom du nouveau salon" autocomplete="off">
        <button type="submit">Créer</button>
      </form>
      <p id="message-salon"></p>

      <ul class="liste-contacts" id="liste-salons">
        <li>Chargement...</li>
      </ul>
      </div>
    </section>
    <section>
      <h4>
        <a 
        href="profil.html">
        Profil utilisateur
        </a>
        </h4>
    </section>
  </aside>
     <section class="colonne-droite section">
            <h2 id="nom-contact">Sélectionne un contact</h2>
            <div id="liste-messages"></div>

            <form id="formulaire-message" class="barre-message">
              <input type="text" id="champ-message"
              placeholder="Ecris ton message..." autocomplete="off">
                <button type="submit">Envoyer</button>

        


            </form>

            
        </section>
        </div>

        <script type="module" src="messagerie.js"></script>
    </body>
  

    <footer>
